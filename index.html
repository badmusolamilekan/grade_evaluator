<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Evaluator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div
      class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden"
    >
      <div class="bg-indigo-600 p-6 text-white">
        <h1 class="text-2xl font-bold">Grade Evaluator</h1>
        <p class="text-indigo-200 text-sm mt-1">
          Enter your scores below to calculate your results.
        </p>
      </div>

      <form id="gradeForm" class="p-6 space-y-5">
        <div class="space-y-2">
          <label
            for="mathInput"
            class="block text-sm font-semibold text-slate-700"
            >Mathematics</label
          >
          <input
            type="number"
            id="mathInput"
            placeholder="Enter your Mathematics score"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400"
          />
        </div>

        <div class="space-y-2">
          <label
            for="engInput"
            class="block text-sm font-semibold text-slate-700"
            >English Language</label
          >
          <input
            type="number"
            id="engInput"
            placeholder="Enter your English score"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400"
          />
        </div>

        <div class="space-y-2">
          <label
            for="civicInput"
            class="block text-sm font-semibold text-slate-700"
            >Civic Education</label
          >
          <input
            type="number"
            id="civicInput"
            placeholder="Enter your Civic Education score"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400"
          />
        </div>

        <div class="space-y-2">
          <label
            for="biologyInput"
            class="block text-sm font-semibold text-slate-700"
            >Biology</label
          >
          <input
            type="number"
            id="biologyInput"
            placeholder="Enter your Biology score"
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-indigo-200 transition-all active:scale-[0.98] mt-2"
        >
          Calculate Results
        </button>

        <div class="mt-6 pt-6 border-t border-slate-100">
          <p
            id="emptyResult"
            class="text-center text-red-500 font-medium empty:hidden"
          ></p>
          <div
            id="valueResult"
            class="text-center text-slate-800 font-semibold text-lg empty:hidden"
          ></div>
        </div>
      </form>
    </div>

    <script src="evalution.js"></script>
  </body>
</html>
